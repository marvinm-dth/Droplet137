<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Checklist</title>
</head>

<body>
    <div class="container-md">
        <div class="bg-dark text-white text-center py-1 fs-4 mb-2">Checklists Templates</div>
        <div id="checklists-wrapper" class="d-flex flex-wrap gap-4"></div>
    </div>
<script>
    let checklists;

    document.addEventListener("DOMContentLoaded", async () => {
        await refreshEverything();
    });

    async function refreshEverything() {
        await fetchChecklists();
        populateChecklistsWrapper();
    }

    async function fetchChecklists() {
        let res = await fetch(`/json/template-checklists`)
        checklists = await res.json();
    }

    function populateChecklistsWrapper() {
        let checklistsDivs = checklists.map(checklist => {
            return `
                <div class="card" style="width: calc(25% - 18px); ">
                    <div id="checklist-${checklist.id}"class="card-body">
                        <h5 class="card-title">${checklist.name}</h5>
                        <a href="/page/checklists/edit?checklist_id=${checklist.id}">Open</a>
                    </div>
                </div>`;
        }).join('');
        document.querySelector("#checklists-wrapper").innerHTML = checklistsDivs;
    }
</script>
</body>


</html>
