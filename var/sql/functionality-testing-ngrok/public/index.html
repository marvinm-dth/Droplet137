<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f4f4f4;
            padding: 20px;
        }
        .menu-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .menu-btn {
            margin: 10px;
            padding: 15px 25px;
            border: none;
            background: #007BFF;
            color: white;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            width: 200px;
        }
        .menu-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>Main Menu</h1>
        <button class="menu-btn" onclick="location.href = '/bscanner.html'">Barcode scanner</button>
        <button class="menu-btn" onclick="location.href = '/scandetect.html'">Scanning detect</button>
        <button class="menu-btn" onclick="location.href = '/camera1.html'">Camera 1</button>
        <button class="menu-btn" onclick="location.href = '/camera2.html'">Camera 2</button>
    </div>

    <script>
        function handleOption(option) {
            alert(`You selected Option ${option}`);
            // Redirect or handle options as needed
        }
    </script>
</body>
</html>
