<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }
    #scanner-container {
      width: 90%;
      max-width: 400px;
      height: 300px;
      border: 2px solid #ccc;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background-color: black;
    }
    @media (max-width: 480px) {
      #scanner-container {
        height: 250px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#000000">
  <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
        .then(registration => {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
        })
        .catch(err => {
        console.log('ServiceWorker registration failed: ', err);
        });
    });
    }
</script>
</head>
<body>
  <h1>Scan Barcode Here</h1>
  <div id="scanner-container"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById("message").innerText = "Camera access not supported on this device.";
        return;
      }

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#scanner-container'),
          constraints: {
            facingMode: "environment"
          }
        },
        decoder: {
          readers: ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader"]
        },
        locate: true
      }, function(err) {
        if (err) {
          console.error(err);
          document.getElementById("message").innerText = "Error initializing scanner.";
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function(result) {
        const barcode = result.codeResult.code;
        setTimeout(() => {
          window.location.href = `/request_material?barcode=${encodeURIComponent(barcode)}`;
        }, 1000);
      });
    });
  </script>
</body>
</html>
