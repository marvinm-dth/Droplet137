<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Items to Table</title>
    
    <!-- ============================
            BEGIN: Base + Responsive Styles
    ============================ -->
    <style>
        /* ===== Base Page Styles ===== */
        body {
        font-family: 'Poppins', sans-serif;
        text-align: center;
        background-color: #f8f9fa;
        color: #333;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
    
        /* Container wrapper */
        .container_info {
        width: 90%;
        max-width: 800px;
        margin: 20px auto;
        background-color: #fff;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        box-sizing: border-box;
        }
    
        /* Header row (home icon, “Add Item” title, logout) */
        .header {
        display: flex;
        align-items: center;
        justify-content: start;
        position: relative;
        padding-bottom: 20px;
        }
        .header a.logo img {
        width: 30px;
        height: 30px;
        margin-right: 10px;
        }
        .header h1 {
        font-size: 2.5em;
        font-weight: 700;
        color: #333;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        white-space: nowrap;
        }
        .link-button {

        padding: 8px 15px;
        background-color: #17a2b8;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;

        }
        .link-button:hover {

        }

        background-color: #cc716c;
        color: #fff;
        font-size: 1em;
        font-weight: bold;
        border: none;

        cursor: pointer;

        text-decoration: none;
        }
        .logout-button:hover {
        background-color: #b3534e;
        }
    
        /* Language selector row */
        .language-select-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-bottom: 20px;
        padding-left: 10px;
        }
        .language-select-wrapper label {
        font-weight: 500;
        margin-right: 10px;
        font-size: 0.95em;
        }
        .language-select-wrapper select {
        padding: 6px 10px;
        font-size: 0.9em;
        border-radius: 4px;
        border: 1px solid #ccc;
        }
    
        /* Form group (label + input) */

        align-items: center;
        justify-content: flex-start;
        margin-bottom: 20px;
        flex-wrap: wrap;
        }

        }

        font-size: 0.9em;

        }

        overflow-y: auto;
        white-space: normal;

        /* Image preview styling */
        #imagePreview {

        max-width: 200px;

        border-radius: 4px;
        }
    
        /* Submit buttons */
        .button {

        align-items: center;
        justify-content: center;

        top: 0;
        left: 0;

        }

        align-items: center;
        justify-content: center;
        padding: 8px 15px;
        font-size: 0.9em;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;

        }
        .btn-text {
        margin-right: 8px;
        }
        .btn-spinner {
        font-size: 1em;
        color: #fff;

            Responsive: Tablets (≤768px)
        ========================================================================== */

        .container_info {

            padding: 15px;

        ========================================================================== */

   On phones, stack “Add via Link” below the header row
======================================================================== */

        .header .logout-button {

            margin: 0;

            font-size: 0.95em;
        }

    <!-- ============================
            END: Base + Responsive Styles
    ============================ -->

<body>

<div class="container_info" id="info-container" style="width: 100%; max-width: 800px; margin: 0 auto;">
    <div class="header">

        <!-- Add via Link button -->

        <h1>Add Item</h1>

        <!-- Logout buttons -->

    </div>

    <div style="display: flex; align-items: left; justify-content: left; margin-bottom: 20px;">

<!-- Modal for adding via link -->
<div id="linkModal" class="modal">

        <span class="close" id="modalCloseBtn">&times;</span>

        <div class="form-group" style="display: none;">

            <label for="fetchUrl"><b>Item URL:</b></label>
            <input type="text" id="fetchUrl" placeholder="Enter item URL" />
        </div>

        <button id="fetchBtn" class="add-btn">
            <span class="btn-text">Add Item</span>
            <i class="fas fa-spinner fa-spin btn-spinner" style="display:none; margin-left:8px;"></i>
        </button>
    </div>
</div>

<script>
    function showLoading() {
            // Disable the submit button to prevent multiple submissions
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                button.disabled = true;
            });

            // Hide button text and show the loading spinner
            const buttonTexts = document.querySelectorAll('.button-text');
            const spinners = document.querySelectorAll('.loading-spinner');

            buttonTexts.forEach(text => text.style.display = 'none');
            spinners.forEach(spinner => spinner.style.display = 'inline-block');
        }

    function updateDescriptions() {
        const language = document.getElementById('languageSelect').value;

        // Save the selected language in local storage
        localStorage.setItem('selectedLanguage', language);

        // Get all elements with class 'data-english' and 'data-mandarin'
        const englishElements = document.querySelectorAll('.data-english');
        const mandarinElements = document.querySelectorAll('.data-mandarin');

        if (language === 'english') {
            englishElements.forEach(element => {
                element.style.display = 'block';
            });
            mandarinElements.forEach(element => {
                element.style.display = 'none';
            });
        } else if (language === 'chinese') {
            englishElements.forEach(element => {
                element.style.display = 'none';
            });
            mandarinElements.forEach(element => {
                element.style.display = 'block';
            });
        }

    }

     // Modal logic
     const modal = document.getElementById('linkModal');
    const openBtn = document.getElementById('addViaLinkBtn');
    const closeBtn = document.getElementById('modalCloseBtn');

    openBtn.addEventListener('click', () => modal.style.display = 'block');
    closeBtn.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

    document.getElementById('fetchBtn').onclick = () => {
        const btn     = document.getElementById('fetchBtn');
        const btnText = btn.querySelector('.btn-text');
        const spinner = btn.querySelector('.btn-spinner');

        // 1) show loading
        btn.disabled       = true;
        btnText.style.display   = 'none';
        spinner.style.display   = 'inline-block';

        const url = document.getElementById('fetchUrl').value.trim();
        if (!url) {
            alert('Please enter an item URL.');
            // reset
            btn.disabled       = false;
            btnText.style.display   = 'inline';
            spinner.style.display   = 'none';
            return;
        }

        const supplierName = document.getElementById('modalSupplierName').value;
        const qs = `?url=${encodeURIComponent(url)}&supplier_name=${encodeURIComponent(supplierName)}`;
        fetch(`/fetch_item_details${qs}`)
            .then(res => res.json())
            .then(data => {
                // Example field mappings; adjust keys as per your API
                document.querySelector('input[name="supplier_sku_number"]').value = data.product_id;
                document.querySelector('input[name="item_desc"]').value = data.sku;
                document.querySelector('input[name="price"]').value = data.price;
                document.querySelector('input[name="product_details"]').value = data.details;
                document.querySelector('input[name="pack_size"]').value = data.pack_size;
                // Close modal
                modal.style.display = 'none';

            // Then handle scraped image
            if (data.item_image) {
            const preview = document.getElementById('imagePreview');
            
            // 1) Show the base64 image
            preview.src = data.item_image;
            preview.style.display = 'block';

            // 2) Decode the base64 into a Blob
            const [header, b64Data] = data.item_image.split(',');
            const contentType = header.match(/data:(.*);base64/)[1];
            const byteChars = atob(b64Data);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
                byteNumbers[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: contentType });

            // 3) Build a File using product_id as filename
            const ext = contentType.split('/')[1] || 'jpg';
            const filename = `${data.product_id}.${ext}`;
            const file = new File([blob], filename, { type: contentType });

            // 4) Assign it to the file input
            const dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('imageInput').files = dt.files;
            }

            // Close modal
            modal.style.display = 'none';
        })
        .catch(err => console.error('Fetch error:', err))
        .finally(() => {
            // 2) hide loading (whether success or failure)
            btn.disabled       = false;
            btnText.style.display   = 'inline';
            spinner.style.display   = 'none';
            });
    };
</script>

<script>
(function () {
  const SERVER = "https://inventory.orcagroup.io:5024";
  const UPLOAD = SERVER + "/upload?category=image";
  const INSERT = SERVER + "/home-depot-items";

  /* tiny helpers */
  const $ = (s) => document.querySelector(s);
  const val = (s) => ($(s) ? $(s).value : "");
  const num = (s, d = null) => {
    const v = val(s).trim();
    const n = Number(v);
    return v === "" || !Number.isFinite(n) ? d : n;
  };

  /* upload helpers (same payload shape as old mapper) */
  async function uploadFile(file, meta) {
    const fd = new FormData();
    fd.append("image", file);
    fd.append("file", file);
    if (meta.name) fd.append("supplierName", meta.name);
    if (meta.sku) fd.append("supplierSku", meta.sku);
    const r = await fetch(UPLOAD, { method: "POST", body: fd });
    if (!r.ok) throw new Error(`upload failed (${r.status})`);
    return (await r.json()).url;
  }
  async function uploadByUrl(url, meta) {
    const fd = new FormData();
    fd.append("imageUrl", url);
    if (meta.name) fd.append("supplierName", meta.name);
    if (meta.sku) fd.append("supplierSku", meta.sku);
    const r = await fetch(UPLOAD, { method: "POST", body: fd });
    if (!r.ok) throw new Error(`upload-by-url failed (${r.status})`);
    return (await r.json()).url;
  }

  /* build DB row for /home-depot-items */
  function supplierIdFromAction(form) {
    const m = (form.action || "").match(/\/submit_material\/(\d+)/);
    return m ? Number(m[1]) : null;
  }
  const supplierName = $("#modalSupplierName")?.value || null;
  function buildRow({ imageUrl, supplierId }) {
    const sku = num('input[name="supplier_sku_number"]');
    return {
      internet_sku_number: sku,
      sku_number: null,
      item_desc: val('input[name="item_desc"]').trim() || null,
      item_price: num('input[name="price"]', null),
      item_details: val('input[name="product_details"]').trim() || null,
      inventory_location: val('select[name="inv_location"]').value || null,
      reorder_point: num('input[name="reorder_point"]', 0),
      pack_size: num('input[name="pack_size"]', 1),
      keywords: val('input[name="keywords"]').trim() || "",
      item_brand: supplierName,
      item_image: imageUrl || null,
      supplier_id: supplierId,
      inventory: 0
      /* remaining cols default/null */
    };
  }

  async function handleSubmit(e) {
    e.preventDefault();              /* stop Flask POST */
    try {
      showLoading();                 /* reuse your spinner helper */

      const sku = num('input[name="supplier_sku_number"]', null);
      const desc = val('input[name="item_desc"]').trim();
      if (!sku || !desc) {
        alert("Supplier SKU Number and Description are required.");
        return;
      }

      /* upload image (file first, else URL from modal) */
      let imageUrl = null;
      const fileInp = $("#imageInput");
      if (fileInp && fileInp.files && fileInp.files[0]) {
        imageUrl = await uploadFile(fileInp.files[0], {
          name: supplierName,
          sku
        });
      } else {
        const url = val("#fetchUrl");
        if (url) imageUrl = await uploadByUrl(url, { name: supplierName, sku });
      }

      /* insert via server */
      const row = buildRow({
        imageUrl,
        supplierId: supplierIdFromAction(e.currentTarget)
      });
      const r = await fetch(INSERT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(row)
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "insert failed");

      alert("✅ Saved! material_id = " + j.material_id);
      e.currentTarget.reset();
      $("#imagePreview").style.display = "none";
    } catch (err) {
      console.error(err);
      alert("Insert failed → " + err.message);
    } finally {
      /* restore buttons */
      document.querySelectorAll(".button").forEach((b) => (b.disabled = false));
      document
        .querySelectorAll(".button-text")
        .forEach((t) => (t.style.display = "inline"));
      document
        .querySelectorAll(".loading-spinner")
        .forEach((s) => (s.style.display = "none"));
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    /* attach AFTER your original code has wired the modal etc. */
    const form =
      document.querySelector('form[action*="/submit_material"]') ||
      document.querySelector("form");
    form?.addEventListener("submit", handleSubmit, { passive: false });
  });
})();
</script>
