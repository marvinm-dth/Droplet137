<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 10px;
            background-color: #ffffff;
            color: white;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .home-link {
            position: absolute;
            left: 0;
            padding-left: 15px;
            display: flex;
            align-items: center;
        }

        .home-logo {
            width: 30px;
            height: 30px;
        }

        .header-inner h1 {
            margin: 0;
            font-size: 2.5vw;
        }


        h1 {
            font-size: 2em;  /* Slightly smaller title */
            font-weight: 700;
            color: #343a40;
            margin-top: 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            background-color: #f1f1f1;
            border-bottom: 2px solid #007bff;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #007bff;
            border: 1px solid #007bff;
            border-bottom: none;
            background-color: white;
            margin: 0 5px;
        }

        .tab.active {
            background-color: #007bff;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 10px;
            height: calc(100vh - 170px);
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: auto;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 0.6vw;
            font-size: 1.2vw;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        td img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }

        .home-logo {
            width: 25px;
            height: 25px;
            vertical-align: middle;
            margin-right: 10px;
        }

        @media screen and (max-width: 768px) {
            th, td {
                font-size: 3vw;
                padding: 1vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-inner">
                <a href="{{ url_for('main') }}" class="home-link">
                    <img src="/static/home-logo.png" alt="Home" class="home-logo">
                </a>
                <h1>Dragon Tiny Homes Delivery Items</h1>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('orders-tab')">Orders</div>
            <div class="tab" onclick="switchTab('requested-tab')">Requested Items</div>
        </div>

        <div id="orders-tab" class="tab-content active">
            <table id="dashboard-items-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Order ID</th>
                        <th>Supplier Order ID</th>
                        <th>Material ID</th>
                        <th>Name</th>
                        <th>名称</th>
                        <th>Total Quantity Remaining</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="requested-tab" class="tab-content">
            <table id="request-items-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Supplier Name</th>
                        <th>Material ID</th>
                        <th>Name</th>
                        <th>名称</th>
                        <th>Total Quantity Requested</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Tab switching logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function fetchData() {
            const response = await fetch('/api/dashboard');
            const request_response = await fetch('/api/request_dashboard');
            const data = await response.json();
            const request_data = await request_response.json();
            renderTable(data);
            renderrequestTable(request_data);
        }

        function renderTable(data) {
            const tbody = document.querySelector("#dashboard-items-table tbody");
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.item_image}"></td>
                        <td>${item.order_id}</td>
                        <td>${item.supplier_order_number}</td>
                        <td>${item.material_id}</td>
                        <td>${item.item_desc}</td>
                        <td>${item.item_desc_mandarin}</td>
                        <td>${item.order_qty_remaining}</td>
                    </tr>
                `;
            });
        }

        function renderrequestTable(data) {
            const tbody = document.querySelector("#request-items-table tbody");
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.item_image}"></td>
                        <td>${item.supplier_name}</td>
                        <td>${item.material_id}</td>
                        <td>${item.item_desc}</td>
                        <td>${item.item_desc_mandarin}</td>
                        <td>${item.quantity_requested}</td>
                    </tr>
                `;
            });
        }

        // Fetch initially and every 4 seconds
        fetchData();
        setInterval(fetchData, 4000);
    </script>
</body>
</html>
