<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <link rel="manifest" crossorigin="use-credentials" href="/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('Service Worker Registration Failed', err));
        }
    </script>
    <style>
        #qr-reader {
            width: 300px;
            margin: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container text-center py-5">

    <h1 style="text-align: center;">PWA Bar/QR Code Scanner</h1>
    <button id="start-button" class="w-100">Start Scanning</button>
    <button id="stop-button" class="w-100" style="display: none;">Stop Scanning</button>    

    <div id="result" class="mt-2 fw-bolder">Scan a QR code to see the result here.</div>
    
    <div id="qr-reader" class="mt-5" style="display: none;"></div>
</div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script>
        let qrScanner;
        const startButton = document.getElementById('start-button');
        const stopButton = document.getElementById('stop-button');
        const qrReaderDiv = document.getElementById('qr-reader');
        const resultDiv = document.getElementById('result');

        // Start scanning function
        function startScanning() {
            if (qrScanner) return;  // Prevent multiple scanners from starting

            qrScanner = new Html5Qrcode("qr-reader");
            qrReaderDiv.style.display = 'block';

            qrScanner.start(
                { facingMode: "environment" },  // Use the rear camera
                {
                    fps: 10,          // Frames per second
                    qrbox: 250        // Scanning box size
                },
                (decodedText, decodedResult) => {
                    // Handle a successful scan
                    resultDiv.innerHTML = `Bar/QR Code detected: <span class="d-block fs-2 text-success">${decodedText}</span>`;
                    stopScanning();   // Automatically stop after a successful scan
                },
                (errorMessage) => {
                    // Log errors (optional)
                    console.warn('QR Scan Error:', errorMessage);
                }
            ).then(() => {
                stopButton.style.display = 'block';  // Show stop button
                startButton.style.display = 'none';  // Hide start button
            }).catch(err => {
                console.error('Failed to start scanner:', err);
                resultDiv.textContent = 'Error initializing camera. Please check permissions.';
            });
        }

        // Stop scanning function
        function stopScanning() {
            if (qrScanner) {
                qrScanner.stop().then(() => {
                    qrScanner = null;  // Reset scanner instance
                    qrReaderDiv.style.display = 'none';
                    stopButton.style.display = 'none';
                    startButton.style.display = 'block'; 
                }).catch(err => {
                    console.error('Error stopping scanner:', err);
                });
            }
        }

        // Attach event listeners to buttons
        startButton.addEventListener('click', startScanning);
        stopButton.addEventListener('click', stopScanning);
    </script>
    <script>
    window.addEventListener('keydown', (event) => {
    alert(`Key: ${event.key}, Code: ${event.code}, KeyCode: ${event.keyCode}`);
});

window.addEventListener('keyup', (event) => {
    alert(`Key released: ${event.key}`);
});

document.getElementById("myInput").addEventListener("beforeinput", (event) => {
    console.log("Input Type:", event.inputType, "Data:", event.data);
});

window.addEventListener('gamepadconnected', (event) => {
    alert('Gamepad connected:', event.gamepad);
});

window.addEventListener('gamepaddisconnected', (event) => {
    alert('Gamepad disconnected:', event.gamepad);
});

document.addEventListener("beforeinput", (event) => {
    console.log("Input Type:", event.inputType, "Data:", event.data);
});

navigator.hid.requestDevice({ filters: [] })
    .then(devices => {
        alert('HID devices:', devices);
    })
    .catch(err => {
        alert('HID request failed:', err);
    });
    </script>
</body>
</html>
