<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh; /* Full TV screen height */
            padding: 20px;
            box-sizing: border-box;
        }

        .header-container {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.3/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.3/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        $(document).ready(function() {
            $('#prelisted-items-table').DataTable(); // Initialize DataTables on the table
        });
    </script>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
            .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
            });
        });
        }
    </script>
</head>
<body>
    <div class="container_info" id="info-container" style="width: 100%; max-width: 700px; margin: 0 auto;">
        <div class="header">
            <a href="{{ url_for('main') }}" style="text-decoration: none; color: inherit;">
                <img src="/static/home-logo.png" alt="Home" style="width: 30px; height: 30px; vertical-align: middle; margin-right: 10px;">
            </a>
            <h1>Dragon Tiny Homes Inventory Logs</h1>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <img id="item_image" src = "{{ material_data.item_image }}" style="height:500px; width:500px">
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="material_id"><strong>Material ID: {{ material_data.material_id }}</strong></span>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="supplier_id"><strong>Supplier ID: {{ material_data.internet_sku_number }}</strong></span>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="item_desc"><strong>{{ material_data.item_desc }}</strong></span>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="item_desc_mandarin"><strong>{{ material_data.item_desc_mandarin }}</strong></span>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="item_price"><strong>${{ material_data.item_price }}</strong></span>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <span id="item_desc_mandarin"><strong>QTY:</strong>
                <input type="number" id="quantity_used" name="quantity_used"  style="width: 35px; text-align: center" />
            </span>
        </div>

        <button onclick="submitInventory()" class="add-btn">Submit Inventory</button>
    </div>
    <script>
        function submitInventory() {
            // Get data from the HTML elements
            const orderName = "{{ user.name }}";
            const materialId = document.getElementById('material_id').innerText.replace('Material ID: ', '').trim();
            const supplierId = document.getElementById('supplier_id').innerText.replace('Supplier ID: ', '').trim();
            const itemDesc = document.getElementById('item_desc').innerText.trim();
            const itemDescMandarin = document.getElementById('item_desc_mandarin').innerText.trim();
            const itemPrice = document.getElementById('item_price').innerText.replace('$', '').trim();
            const quantityUsed = document.getElementById('quantity_used').value;
            const itemImage = document.getElementById('item_image').src;
    
            // Validate input
            if (!quantityUsed || quantityUsed <= 0) {
                alert('Please enter a valid quantity.');
                return;
            }
    
            // Create an object with the data
            const inventoryData = {
                inv_name: orderName,
                material_id: materialId,
                supplier_id: supplierId,
                item_price: itemPrice,
                item_desc: itemDesc,
                item_desc_mandarin: itemDescMandarin,
                quantity_used: parseInt(quantityUsed, 10),
                item_image: itemImage,
            };
    
            console.log('Collected Inventory Data:', inventoryData);
    
            // Send the data to the server
            fetch('/add_inventory_used_qr', { // Update with your server endpoint
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(inventoryData),
            })
            .then(response => response.json())
                .then(data => {
                    if (data.message && data.redirect_url) {
                        alert('Inventory successfully added: ' + data.message);
                        window.location.href = data.redirect_url; // Use the redirect URL from the server response
                    } else {
                        console.error('Invalid response:', data);
                        alert('An error occurred while processing the order.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
