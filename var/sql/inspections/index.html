<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspections Dashboard</title>
    <style>
      /* =============================
         Theme tokens — High contrast DEFAULT
         (No framework; vanilla CSS only)
         ============================= */
      :root{
        --bg:#060913;            /* page background */
        --card:#0f172a;          /* card background */
        --muted:#c9d1e2;         /* secondary text */
        --text:#ffffff;          /* primary text */
        --ok:#56ffd0;            /* complete */
        --warn:#ffd666;          /* pending */
        --bad:#ff7a99;           /* failed */
        --border:#2e4370;        /* borders */
        --ink:#142041;           /* chips */
        --shadow: 0 10px 28px rgba(0,0,0,.55);
        --radius:16px;
        --accent:#8ab4ff;
      }


      /* =============================
         Base layout & typography
         ============================= */
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
        line-height:1.45;
        background:var(--bg); color:var(--text);
        -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      }
      a{color:inherit}

      header{
        position:sticky; top:0; z-index:10;
        padding:8px 0px; border-bottom:1px solid var(--border);
        background:linear-gradient(180deg, rgba(6,9,19,.95), rgba(6,9,19,.82));
        backdrop-filter:saturate(140%) blur(6px);
      }
      .wrap{width:100%; margin:0 auto; padding:0 20px}
      .toprow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
      .titlebar{display:flex; align-items:center; gap:14px; min-height:36px; flex-wrap:wrap}
      h1{font-size:22px; margin:0; display:flex; align-items:center; gap:10px; white-space:nowrap}

      .brand-ic{display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--border)}
      .brand-ic svg{width:15px; height:15px; color:var(--accent)}

      /* small legend chips inline to the right of the title */
      .legend{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; flex-wrap:wrap}
      .chip{display:inline-flex; align-items:center; gap:6px; background:var(--ink); border:1px solid var(--border); border-radius:999px; padding:4px 8px}
      .dot{width:10px; height:10px; border-radius:50%; box-shadow: 0 0 0 2px rgba(255,255,255,.06) inset}

      .actions{display:flex; align-items:center; gap:10px}
      .btn{appearance:none; background:#1b2a47; color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .08s ease, background .2s ease, border-color .2s ease; font-weight:700}
      .btn:hover{transform:translateY(-1px); background:#203257}
      .btn:active{transform:translateY(0)}
      .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
      /* enforce same width & text size for header actions */
      .actions .btn{width:120px; font-size:14px; line-height:1}

      @media (max-width: 640px){
        h1{white-space:normal}
        .toprow{flex-direction:column; align-items:flex-start; gap:16px}
        .titlebar{width:100%; gap:12px}
        .legend{width:100%; justify-content:flex-start}
        .actions{width:100%; flex-direction:column; align-items:stretch; gap:8px}
        .actions .btn{width:100%}
      }

      main.wrap{padding:14px 20px 24px}

      /* Grid should fill huge displays and start from LEFT edge */
      .grid{display:grid; gap:14px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); align-items:start}

      .card{background: linear-gradient(180deg, rgba(19,28,47,.92), rgba(9,14,26,.98)); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px 6px; box-shadow: var(--shadow); transition: border-color .2s ease, box-shadow .2s ease, transform .08s ease}
      .card:hover{border-color:#3a5591; box-shadow: 0 16px 40px rgba(5,10,20,.6); transform: translateY(-1px)}
      .card.today{background:rgba(32,45,77,.92); border-color:rgba(138,180,255,.7)}
      .card.today:hover{border-color:rgba(138,180,255,.7); box-shadow: 0 16px 40px rgba(5,10,20,.6)}
      .card.today .title{color:var(--accent)}

      .card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
      .title{font-size:17px; font-weight:800}
      .muted{color:var(--muted); font-size:12px}

      /* Progress bar (complete count / 7) — thicker to match upcoming bar */
      .progress{height:8px; border-radius:999px; background:#0e1a33; border:1px solid var(--border); overflow:hidden; margin:6px 0 6px}
      .progress > span{display:block; height:100%; background:var(--ok); width:0%}

      /* tighter rows, better alignment */
      .row{display:grid; grid-template-columns: 1fr auto 18px; align-items:center; gap:8px; padding:4px 0}
      .row + .row{border-top:1px dashed rgba(255,255,255,.06)}
      .row.today-stage{border-top:0; background:rgba(138,180,255,.16); border-radius:12px; padding:4px 6px; margin:0; box-shadow:0 0 0 1px rgba(138,180,255,.3)}
      .row.today-stage .name{color:#f6f9ff}
      .row.today-stage .subtle{color:#dbe6ff}
      .row.today-stage .pill{box-shadow:0 0 0 1px rgba(138,180,255,.25), 0 0 12px rgba(138,180,255,.18)}
      .row.today-stage .file-ic{border-color:rgba(138,180,255,.5); color:var(--accent)}

      .nameCol{display:flex; flex-direction:column; gap:2px}
      .name{display:flex; align-items:center; gap:8px; font-weight:600}
      .name .label-zh{margin-left:0; font-size:.74em}
      .subtle{color:var(--muted); font-size:12px}
      .date-line{min-height:16px;}
      .label-en{font-weight:inherit}
      .label-zh{display:inline-flex; align-items:center; margin-left:6px; font-size:.78em; color:rgba(166,208,255,.92); letter-spacing:.04em; font-weight:600}

      /* Status pill */
      .pill{font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid transparent; background:rgba(22,32,56,.78); white-space:nowrap; font-weight:800; color:#f8fbff; justify-self:end; box-shadow:0 0 0 1px rgba(255,255,255,.05)}
      .pill.ok{background:rgba(24,255,176,.14); border-color:rgba(82,255,214,.7); color:#7effd8; box-shadow:0 0 18px rgba(82,255,214,.28)}
      .pill.warn{background:rgba(255,214,102,.16); border-color:rgba(255,214,102,.65); color:#ffe697; box-shadow:0 0 18px rgba(255,214,102,.26)}
      .pill.bad{background:rgba(255,112,148,.16); border-color:rgba(255,112,148,.7); color:#ff9fb5; box-shadow:0 0 18px rgba(255,112,148,.28)}

      /* File icon (white if link present, gray if missing) */
      .file-ic{display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; border-radius:6px; background:rgba(255,255,255,.05); border:1px solid var(--border); justify-self:end}
      .file-ic svg{width:11px; height:11px}
      .has-file{color:#ffffff}
      .no-file{color:#6c7b97}

      .hr{height:1px; background:var(--border); margin:10px 0}
      #statusBar{position:fixed; bottom:20px; right:20px; font-size:12px; color:var(--muted); background:rgba(9,14,26,.92); padding:6px 12px; border-radius:999px; border:1px solid var(--border); box-shadow:var(--shadow); pointer-events:none}
      .section-label{margin-bottom:4px; font-size:16px; font-weight:700; color:#f1f5ff}
      .projects-heading{margin:12px 0 10px; font-size:20px; font-weight:800; color:#ffffff; letter-spacing:.01em}

      a.link{color:var(--accent); text-decoration:underline; position:relative}

      /* Skeletons while loading */
      .skeleton{border:1px solid var(--border); border-radius: var(--radius); padding:14px; background: linear-gradient(180deg, rgba(26,35,53,.6), rgba(12,17,27,.85)); box-shadow: var(--shadow)}
      .shine{position:relative; overflow:hidden}
      .shine::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); animation:shimmer 1.2s infinite}
      @keyframes shimmer{100%{transform:translateX(100%)}}
      .sk-line{height:12px; background:#1a2743; border-radius:999px; margin:10px 0}
      .sk-line.w60{width:60%}
      .sk-line.w30{width:30%}
      .sk-row{display:flex; align-items:center; justify-content:space-between; gap:16px}
      .sk-dot{width:12px; height:12px; background:#1a2743; border-radius:50%}

      /* Upcoming today ribbon */
      #upcomingWrap{margin:6px 0 8px; display:grid; gap:12px; grid-template-columns: 1fr minmax(260px, 320px); align-items:start; align-content:start}
      @media (max-width: 1100px){ #upcomingWrap{ grid-template-columns: 1fr; } }
      /* Medium width between last two versions */
      #upcoming{display:grid; gap:8px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));}
      .upcard{border:1px solid var(--border); background:rgba(255,255,255,.03); border-radius:14px; padding:10px 14px 10px; max-width:420px; min-height:95px}
      #upcomingCol{display:flex; flex-direction:column; gap:6px}
      #missingPane{display:flex; flex-direction:column; gap:3px; margin-top:-4px}
      .up-top{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; margin-bottom:2px}
      .up-nameblk{display:flex; flex-direction:column; gap:3px; padding-left:6px}
      .up-name{font-weight:800; font-size:17px}
      .up-type{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
      .up-type .label-en{color:#dbe6ff; font-size:13px}
      .up-type .label-zh{margin-left:0}
      .up-meta{display:flex; align-items:center; gap:12px}
      .up-time{font-variant-numeric: tabular-nums; font-size:28px; font-weight:900; color:#fff; text-align:right}
      .up-at{font-size:16px; font-weight:700; color:#dbe6ff; padding:3px 12px; border:1px solid var(--border); border-radius:999px; background:#112045}
      .up-progress{position:relative; height:8px; border-radius:999px; background:#0e1a33; border:1px solid var(--border); overflow:hidden; margin-top:6px}
      /* Fill anchored LEFT; width = remaining fraction; shrinks right->left */
      .up-progress > span{position:absolute; left:0; top:0; bottom:0; width:100%; background:var(--ok)}
      .up-progress.yellow > span{background:var(--warn)}
      .up-progress.red > span{background:var(--bad)}

      /* Missing files compact notifications — exactly two rows on the RIGHT, fill right→left */
      #missingCards{
        display:grid; gap:3px;
        grid-auto-flow:column;                /* add new columns after the first */
        grid-template-rows:repeat(2, auto);   /* two stacked */
        grid-auto-columns:minmax(140px, 1fr);
        justify-content:end;                  /* right-align; new cols appear to the left */
      }
      .miss-card{border:1px solid var(--border); background:rgba(255,255,255,.03); border-radius:10px; padding:4px 7px; display:flex; flex-direction:column; align-items:flex-start; gap:2px}
      .miss-top{display:flex; align-items:center; gap:5px; font-weight:700; font-size:13px}
      .miss-dot{width:8px; height:8px; border-radius:999px}
      .g{background:var(--ok)} .y{background:var(--warn)} .r{background:var(--bad)}
      .miss-type{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
      .miss-type .label-zh{margin-left:0}

      /* Diagnostics pill only */
      #diagBtn{position:fixed; left:20px; bottom:14px; z-index:20; opacity:.85}
      .toast{position:fixed; left:20px; bottom:56px; background:#0f172a; color:var(--muted); border:1px solid var(--border); padding:8px 10px; border-radius:8px; box-shadow:var(--shadow); font-size:12px; opacity:.98}
    </style>
  </head>
  <body>
    <header>
      <div class="wrap toprow">
        <div class="titlebar" style="flex:1 1 auto">
          <h1>
            <span class="brand-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg></span>
            Inspections Dashboard
          </h1>
          <div class="legend">
            <span class="chip"><span class="dot" style="background:var(--ok)"></span>Complete</span>
            <span class="chip"><span class="dot" style="background:var(--warn)"></span>Pending</span>
            <span class="chip"><span class="dot" style="background:var(--bad)"></span>Failed/No</span>
            <span class="chip"><span class="file-ic has-file" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Link</span>
            <span class="chip"><span class="file-ic no-file" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> No link</span>
          </div>
        </div>
        <div class="actions">
          <a class="btn" id="btnAdmin" href="/admin.html">Admin</a>
          <button id="btnRefresh" class="btn" type="button">Refresh</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <!-- Upcoming today ribbon -->
      <section id="upcomingWrap" hidden>
        <div id="upcomingCol">
          <div class="section-label">Upcoming today</div>
          <div id="upcoming"></div>
        </div>
        <div id="missingPane">
          <div class="section-label">Completed, no file</div>
          <div id="missingCards"></div>
        </div>
      </section>

      <div class="hr"></div>
      <div class="projects-heading">Open Projects</div>

      <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <div id="statusBar">Loading…</div>

    <!-- Diagnostics pill only -->
    <button id="diagBtn" class="btn" title="Diagnostics">Diagnostics</button>

    <script>
      // ---------- Config ----------
      const TZ = "America/New_York";
      const INSPECTION_KEYS = ["foundation","framing","dry_in","electrical","plumbing","insulation","final"];
      const LABELS = { foundation:"Foundation", framing:"Framing", dry_in:"Dry-in", electrical:"Electrical", plumbing:"Plumbing", insulation:"Insulation", final:"Final" };
      const LABELS_ZH = { foundation:"地基", framing:"框架", dry_in:"防水封闭", electrical:"电气", plumbing:"管道", insulation:"保温", final:"竣工" };

      // Allow overriding API via query param, e.g. ?api=http://127.0.0.1
      const params = new URLSearchParams(location.search);
      const API_BASE = params.get('api') || '';
      const DATA_URL = `${API_BASE}/rest/dashboard_projects?select=*`;

      // ---------- DOM helpers ----------
      const $ = (id)=>document.getElementById(id);
      function safe(val){ return String(val ?? "").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function absolutize(u){ if(!u) return ""; return /^https?:\/\//i.test(u) ? u : "https://" + String(u).replace(/^\/+/,""); }
      function labelHtml(key){
        const en = `<span class="label-en">${safe(LABELS[key] || key)}</span>`;
        const zh = LABELS_ZH[key] ? `<span class="label-zh">${safe(LABELS_ZH[key])}</span>` : "";
        return zh ? `${en}${zh}` : en;
      }

      // ---------- Dates ----------
      function pickDate(entry){ if (entry?.date?.scheduled) return { label: "Scheduled", iso: entry.date.scheduled }; if (entry?.date?.actual) return { label: "Actual", iso: entry.date.actual }; return null; }
      function fmtNY(iso, opts){ if(!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; try{ return new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...opts }).format(d); }catch(_){ return d.toISOString().slice(0,16).replace('T',' ');} }
      function formatNY(iso){ return fmtNY(iso, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" }); }
      function timeNY(iso){ return fmtNY(iso, { hour:"numeric", minute:"2-digit" }); }

      function statusText(entry){ const s = String(entry?.status ?? "pending").toLowerCase(); if (s === "complete" || s === "true") return "Complete"; if (s === "failed" || s === "false") return "Failed"; return "Pending"; }
      function dotColor(entry){ const t = statusText(entry); return t==="Complete"?"var(--ok)":t==="Failed"?"var(--bad)":"var(--warn)"; }
      function pillClass(entry){ const t = statusText(entry); return t==="Complete"?"pill ok":t==="Failed"?"pill bad":"pill warn"; }
      function isScheduledToday(entry, todayKey, nowTs){
        if(!entry?.date?.scheduled) return false;
        const d = new Date(entry.date.scheduled);
        if(isNaN(d)) return false;
        return dateKeyNY(d) === todayKey && d.getTime() > nowTs;
      }

      // ---------- Skeletons ----------
      function renderSkeletons(n=8){ const grid = $("grid"); grid.innerHTML = Array.from({length:n}).map(()=>`<div class=\"skeleton shine\"><div class=\"sk-line w60\"></div><div class=\"sk-line w30\" style=\"margin-top:-4px\"></div><div class=\"sk-row\" style=\"margin-top:10px\"><div class=\"sk-dot\"></div><div class=\"sk-line\" style=\"width:40%\"></div><div class=\"sk-line\" style=\"width:30%\"></div></div><div class=\"sk-row\"><div class=\"sk-dot\"></div><div class=\"sk-line\" style=\"width:40%\"></div><div class=\"sk-line\" style=\"width:30%\"></div></div><div class=\"sk-row\"><div class=\"sk-dot\"></div><div class=\"sk-line\" style=\"width:40%\"></div><div class=\"sk-line\" style=\"width:30%\"></div></div></div>`).join(""); }

      // ---------- Fetch helpers with diagnostics ----------
      async function fetchJSON(url, options={}, timeoutMs=10000){
        const ctrl = new AbortController(); const id = setTimeout(()=>ctrl.abort(), timeoutMs); let resText = "";
        try{ const res = await fetch(url, { cache:"no-store", credentials:"same-origin", signal: ctrl.signal, ...options }); resText = await res.text(); if(!res.ok){ const err = new Error(`HTTP ${res.status} ${res.statusText}`); err.status = res.status; err.statusText = res.statusText; err.body = resText.slice(0, 800); throw err; } try{ return JSON.parse(resText); } catch{ const err = new Error("Invalid JSON from API"); err.body = resText.slice(0, 800); throw err; } } finally { clearTimeout(id); }
      }

      let lastError = null; function showError(err){ lastError = err; const msg = [ err?.message?`message: ${err.message}`:"", err?.status?`status: ${err.status}`:"", err?.statusText?`statusText: ${err.statusText}`:"", err?.body?`body:\n${err.body}`:"" ].filter(Boolean).join("\n");
        showToast(msg || String(err));
      }

      // ---------- Upcoming ribbon ----------
      const UPC_INT_MS = 1000; // 1s countdown
      let upcomingItems = []; let upTimer = null;
      function dateKeyNY(date){ return fmtNY(date, { year:"numeric", month:"2-digit", day:"2-digit" }); }
      function collectUpcoming(rows){
        const now = new Date(); const todayKey = dateKeyNY(now); const list = [];
        for(const p of rows||[]){ const insp = p?.inspections || {}; for(const key of INSPECTION_KEYS){ const e = insp[key]; if(!e?.date?.scheduled) continue; const d = new Date(e.date.scheduled); if(isNaN(d)) continue; if(dateKeyNY(d) !== todayKey) continue; if(d <= now) continue; list.push({ projectId: p.id, projectName: p.name || "(unnamed)", typeKey:key, when:d, iso:e.date.scheduled }); } }
        list.sort((a,b)=>a.when-b.when); return list;
      }
      function renderUpcoming(){
        const wrap = $("upcomingWrap"); const cont = $("upcoming"); const miss = $("missingCards");
        wrap.hidden = !upcomingItems.length && !miss.children.length;
        cont.innerHTML = upcomingItems.map(it=>`
          <div class="upcard" data-eta="${it.iso}">
            <div class="up-top">
              <div class="up-at">${timeNY(it.iso)}</div>
              <div class="up-nameblk">
                <div class="up-name">${safe(it.projectName)}</div>
                <div class="up-type">${labelHtml(it.typeKey)}</div>
              </div>
              <div class="up-time" data-ct="${it.iso}">--:--</div>
            </div>
            <div class="up-progress"><span></span></div>
          </div>
        `).join("");
      }
      function remainingFraction(diffMs){
        const H=3600000, M=60000;
        if (diffMs <= 10*M){ return { frac: Math.max(0, diffMs/(10*M)), cls:'red' }; }
        if (diffMs <= 60*M){ return { frac: Math.max(0, diffMs/(60*M)), cls:'yellow' }; }
        const W=8*H; return { frac: Math.min(1, diffMs/W), cls:'' };
      }
      function tickUpcoming(){
        const now = Date.now(); let changed=false;
        document.querySelectorAll('.upcard').forEach(card=>{
          const iso = card.getAttribute('data-eta'); const target = new Date(iso).getTime(); const diff = target - now; const tEl = card.querySelector('[data-ct]'); const bar = card.querySelector('.up-progress'); const fill = bar?.querySelector('span');
          if (isNaN(target)) { if(tEl) tEl.textContent='--:--'; return; }
          if (diff <= 0) { changed=true; return; }
          const totalSec = Math.floor(diff/1000); const hh = Math.floor(totalSec/3600); const mm = Math.floor((totalSec%3600)/60); const ss = totalSec%60; const out = hh>0 ? `${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${mm}:${String(ss).padStart(2,'0')}`; if(tEl) tEl.textContent = out;
          if (bar && fill){ const {frac, cls} = remainingFraction(diff); bar.classList.toggle('yellow', cls==='yellow'); bar.classList.toggle('red', cls==='red'); fill.style.width = `${Math.max(0, Math.min(100, frac*100))}%`; }
        });
        if (changed){ upcomingItems = upcomingItems.filter(it => new Date(it.iso).getTime() > now); renderUpcoming(); }
      }

      // ---------- Missing files (completed without link) compact cards ----------
      function collectMissing(rows){
        const out=[]; for(const p of rows||[]){ const insp=p?.inspections||{}; for(const k of INSPECTION_KEYS){ const e=insp[k]; if(!e) continue; const isComplete = String(e.status).toLowerCase()==='complete' || e.status===true; const hasLink=!!e?.link; if(isComplete && !hasLink){ let cls='y'; const stamp = e?.date?.actual || e?.date?.scheduled; let ts = Infinity; if(stamp){ ts = new Date(stamp).getTime(); const ageH=(Date.now()-ts)/3600000; cls = ageH<=2? 'g' : ageH<=8? 'y' : 'r'; } out.push({ projectName:p?.name||'(unnamed)', typeKey:k, cls, ts }); } } }
        return out;
      }
      function renderMissing(list){
        const cont=$("missingCards"); const sorted = (list||[]).slice().sort((a,b)=>a.ts-b.ts).slice(0,6);
        cont.innerHTML = sorted.map(it=>`
          <div class="miss-card"><div class="miss-top"><span class="miss-dot ${it.cls}"></span>${safe(it.projectName)}</div><div class="miss-type">${labelHtml(it.typeKey)}</div></div>
        `).join('');
      }

      // ---------- Cards ----------
      function completedCount(insp){ let n=0; for(const k of INSPECTION_KEYS){ if((insp?.[k]?.status||"").toLowerCase()==='complete' || (insp?.[k]?.status===true)) n++; } return n; }
      function renderRows(rows){
        const grid = $("grid"); if(!Array.isArray(rows) || rows.length === 0){ grid.innerHTML = `<div class="muted">No projects yet.</div>`; return; }
        const now = new Date(); const todayKey = dateKeyNY(now); const nowTs = now.getTime();
        grid.innerHTML = rows.map(p=>{ const insp = p?.inspections ?? {}; const done = completedCount(insp); const pct  = Math.round((done/INSPECTION_KEYS.length)*100);
          const hasToday = INSPECTION_KEYS.some(key => isScheduledToday(insp?.[key], todayKey, nowTs));
          const itemsHtml = INSPECTION_KEYS.map(key=>{ const e = insp?.[key] ?? {}; const chosen = pickDate(e); const dateText = chosen ? `${formatNY(chosen.iso)}` : "\u00A0"; const hasLink = !!e?.link; const fileIc = `<span class=\"file-ic ${hasLink?"has-file":"no-file"}\" title=\"${hasLink?"Link attached":"No link"}\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6\"/></svg></span>`; const linkHtml = hasLink ? `<a class=\"link\" href=\"${safe(absolutize(e.link))}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Open file for ${LABELS[key]}\">${fileIc}</a>` : fileIc; const status = statusText(e); const rowClass = `row${isScheduledToday(e, todayKey, nowTs) ? " today-stage" : ""}`;
            return `<div class=\"${rowClass}\"><div class=\"nameCol\"><div class=\"name\"><span class=\"dot\" style=\"background:${dotColor(e)}\"></span>${labelHtml(key)}</div><div class=\"subtle date-line\">${dateText}</div></div><span class=\"${pillClass(e)}\">${status}</span>${linkHtml}</div>`; }).join("");
          return `<article class=\"card${hasToday ? " today" : ""}\"><div class=\"card-head\"><div class=\"title\">${safe(p?.name ?? "(unnamed)")}</div><div class=\"muted\">${done}/${INSPECTION_KEYS.length}</div></div><div class=\"progress\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"${INSPECTION_KEYS.length}\" aria-valuenow=\"${done}\"><span style=\"width:${pct}%\"></span></div><div class=\"muted\" style=\"margin-bottom:4px\">ID: <code>${safe(p?.id ?? "")}</code>${p?.notion_page_id ? ` • Notion: <code>${safe(p.notion_page_id)}</code>` : ""}</div>${itemsHtml}</article>`; }).join("");
      }

      // ---------- Load pipeline ----------
      async function load(){
        const status = $("statusBar"); status.textContent = "Loading…"; renderSkeletons(6); if (upTimer) { clearInterval(upTimer); upTimer = null; }
        try{
          const rows = await fetchJSON(DATA_URL);
          // Upcoming & Missing
          upcomingItems = collectUpcoming(rows); renderUpcoming(); if (upcomingItems.length){ upTimer = setInterval(tickUpcoming, 1000); tickUpcoming(); }
          renderMissing(collectMissing(rows)); const wrap=$("upcomingWrap"); wrap.hidden = (!upcomingItems.length && !$("missingCards").children.length);
          // Cards
          renderRows(rows); const now = new Date(); const when = new Intl.DateTimeFormat("en-US", { timeZone: TZ, month:"2-digit", day:"2-digit", year:"numeric", hour:"numeric", minute:"2-digit" }).format(now); status.textContent = `Last updated: ${when}`;
        }catch(err){ console.error("Dashboard load failed:", err); $("grid").innerHTML = `<div class="card"><div class="muted">Failed to load: ${safe(err?.message || err)}</div></div>`; showError(err); status.textContent = "Error"; }
      }

      // ---------- Diagnostics pill behavior ----------
      function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent = msg || 'No diagnostics'; document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
      $("diagBtn").addEventListener("click", ()=>{ showToast(lastError? String(lastError.message||lastError): 'No recent errors.'); });

      // ---------- Wire up ----------
      $("btnRefresh").addEventListener("click", load);

      // Load on first paint
      window.addEventListener("DOMContentLoaded", load);
    </script>
  </body>
</html>
