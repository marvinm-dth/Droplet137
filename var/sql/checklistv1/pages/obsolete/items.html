<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Checklist Items Dashboard</title>

    <style>
        input[type="checkbox"] {
            width: 20px;  /* Adjust width */
            height: 20px; /* Adjust height */
            cursor: pointer;
        }
        .no-shadow {
            border: none;

        }
        .no-shadow:focus {
            box-shadow: none;
        }

    </style>
</head>

<body>

    <div class="container-md border border-dark small p-0">
        <div class="container-fluid mb-5 p-0">
            

            <div class="bg-dark text-white text-center py-1 fs-4">CHECKLIST DASHBOARD</div>
            <div class="py-2 px-4 small fw-bolder">
                NOTE: This is where the manager would manage all checklist items. Create, edit, and delete.
            </div>
            <div class="row py-2 px-4 g-0"> 
                <div class="col row align-items-center g-1">
                    <div class="col-3">
                        <label for="input-filter" class="form-label">Description (EN): </label>
                    </div>
                    <div class="col">
                        <input name="contains" id="input-new-desc-en" type="text" class="form-control" placeholder="Describe the task">
                    </div>
                </div>
            </div>

            <div class="row py-2 px-4 g-0"> 

                <div class="col row align-items-center g-1">
                    <div class="col-3">
                        <label for="input-filter" class="form-label">Translation Overwrite (CN): </label>
                    </div>
                    <div class="col">
                        <input name="contains" id="input-new-overwrite-cn" type="text" class="form-control" placeholder="Replaces the auto-generated translation">
                    </div>
                </div>
            </div>

            <div class="row py-2 px-4 g-0 mb-5"> 

                <div class="col row align-items-center g-1">
                    <div class="col-3">
                        <label for="select-filter" class="form-label">Category: </label>
                    </div>

                    <div class="col-3">
                        <select name="category" id="select-new-category" class="form-select"></select>
                    </div>

                    <div class="col-3">
                        <input id="input-new-category-custom" type="text" class="form-control" placeholder="Custom category">
                    </div>
                        
                    <div class="col-3 d-flex justify-content-end">
                        <button type="button" class="btn btn-primary w-100" onclick="handleCreateNew()">Create new</button>
                    </div>

                </div>
            </div>

            <div class="bg-dark text-white text-center py-1 fs-4">EXISTING DATA</div>
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th class="col-auto">#</th>
                        <th class="col-3">Description (EN)</th>
                        <th class="col-3">描述 (CN) - Auto Generated</th>
                        <th class="col-3">Translation Overwrite (CN)</th>
                        <th class="col-1">Category</th>
                        <th class="col-2">Actions</th>
                    </tr>
                </thead>
                <tbody>
                 
                </tbody>
            </table>
        </div>
    </div>
<script>
    let items;
    let categories;

    document.addEventListener("DOMContentLoaded", async () => {
        await refreshEverything();
    });

    async function refreshEverything() {
        await fetchCategories();
        populateSelectCreateCategory();

        await fetchItems();
        populateTable();
    }

    async function fetchItems() {
        let res = await fetch(`/json/items`)
        items = await res.json();
    }

    async function fetchCategories() {
        let res = await fetch("/categories")
        categories = await res.json();
    }

    async function updateItem(id) {
        let updatedData = {};
        let fields = ["category", "description_en", "translation_overwrite_cn"]
        fields.forEach((field) => {
            let val = document.querySelector(`#${field}-${id} input`)?.value || document.querySelector(`#${field}-${id} select`)?.value || "";
            updatedData[field] = val;
        })
        let res = await fetch(`/json/items/${id}`, {
                                method: 'PATCH',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify(updatedData)
                            });
        if(res.ok) refreshEverything();
    }

    async function deleteItem(id) {
        let res = await fetch(`/json/items/${id}`, {
                                method: 'DELETE'
                            });
        if(res.ok) refreshEverything();
    }

    function populateTable() {
        const tBody = document.querySelector('tbody');
        tBody.innerHTML = '';

        items.forEach(item => {
            const row = document.createElement('tr');
            row.setAttribute('id', `item-${item.id}`); // Set the id for the row
            row.innerHTML = `
                <td class="align-middle text-center">${item.id}</td>
                <td id="description_en-${item.id}"><input class="w-100 form-control" type="text" value="${item.description_en}"></td>
                <td id="description_cn-${item.id}"><input class="w-100 form-control" type="text" value="${item.description_cn}" disabled></td>
                <td id="translation_overwrite_cn-${item.id}"><input class="w-100 form-control" type="text" value="${item.translation_overwrite_cn}"></td>
                <td id="category-${item.id}">
                    <select class="w-100 form-select" >
                        ${populateSelectItemsCategory(item.category)}
                    </select>
                </td>
                <td>
                    <button type="button" class="btn btn-primary" onclick="updateItem(${item.id})">Update</button>
                    <button type="button" class="btn btn-primary" onclick="deleteItem(${item.id})">Delete</button>
                </td>
            `;
            tBody.appendChild(row);
        });
    }

    function populateSelectCreateCategory() {
        let options = categories.map(category => {
            return `<option value="${category}">${category}</option>`;
        }).join('');
        document.querySelector("#select-new-category").innerHTML = `<option value="custom">*custom</option> `+options;
    }

    function populateSelectItemsCategory(chosen) {
        let options = categories.map(category => {
            if(category == chosen) {
                return `<option value="${category}" selected>${category}</option>`;
            }
            return `<option value="${category}">${category}</option>`;
        }).join('');
        return options;
    }


    async function  handleCreateNew() {
        let description_en = document.querySelector("#input-new-desc-en").value;
        let translation_overwrite_cn = document.querySelector("#input-new-overwrite-cn").value;
        let category = document.querySelector("#select-new-category").value;
        let custom_category = document.querySelector("#input-new-category-custom").value;

        category = (category === "custom") ? custom_category : category;

        let new_item = {description_en, translation_overwrite_cn, category};

        let res = await fetch(`/json/items`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(new_item),
        });
        if(res.ok) refreshEverything();
    }

    document.querySelector("#select-new-category").addEventListener('change', (e) => {
        if (e.target.value === 'custom') document.querySelector("#input-new-category-custom").disabled = false;
        else document.querySelector("#input-new-category-custom").disabled = true;
    });


</script>
</body>

</html>
