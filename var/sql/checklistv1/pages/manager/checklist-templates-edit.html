<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .no-shadow {
            border: none;

        }
        .no-shadow:focus {
            box-shadow: none;
        }

        .bg-secondary {
            background-color: #D9D9D9 !important;
        }
    </style>
</head>
<body>
    <div class="container-md p-0">

        <div class="bg-secondary text-center py-1 fs-4 mb-2">Checklist Template</div>

        <div class="row mb-2">
            <div class="col-3">
                <label for="checklist-name" class="form-label">Name: </label>
            </div>
            <div class="col-9">
                <input id="checklist-name" type="text" class="form-control">
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-3">
                <label for="checklist-description_en" class="form-label">Description (EN): </label>
            </div>
            <div class="col-9">
                <input id="checklist-description_en" type="text" class="form-control">
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-3">
                <label for="checklist-description_cn" class="form-label">Auto Description (CN): </label>
            </div>
            <div class="col-9">
                <input id="checklist-description_cn" type="text" class="form-control" disabled>
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-3">
                <label for="checklist-translation_overwrite_cn" class="form-label">Translation Overwrite (CN): </label>
            </div>
            <div class="col-9">
                <input id="checklist-translation_overwrite_cn" type="text" class="form-control">
            </div>
        </div>


        <div class="bg-secondary text-center py-1 fs-4">Items</div>
        <table class="table table-sm table-bordered table-striped">
            <thead>
                <tr>
                    <th class="col-auto">#</th>
                    <th class="col">
                        <span>Title</span>
                        <span class="d-none">标题</span>
                    </th>
                    <th class="col">
                        <span>Description</span>
                        <span class="d-none">描述</span>
                    </th>
                    <th class="col">
                        <span>Notes</span>
                        <span class="d-none">笔记</span>
                    </th>
                    <th class="col">
                        <span>Video Link</span>
                        <span class="d-none">视频链接</span>
                    </th>
                    <th class="col">
                        <span>Video Description</span>
                        <span class="d-none">视频说明</span>
                    </th>
                    <th class="col">
                        <span>Actions</span>
                        <span class="d-none">作用</span>
                    </th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>


    <script>
        let checklistInfo;
        let checklistItems;
        
        document.addEventListener("DOMContentLoaded", async () => {
            await refreshEverything();
        });

        async function refreshEverything() {
            await fetchChecklistInfo();
            populateChecklistInfo();
            populateChecklistItems();
            attachListeners();
        }

        async function fetchChecklistInfo() {
            const checklist_id = new URLSearchParams(window.location.search).get("checklist_id");
            if(!checklist_id) window.location.href = "/checklists/manage"
            let res = await fetch(`/api/checklist-templates/${checklist_id}`)
            checklistInfo = await res.json();
            checklistItems = checklistInfo.all_template_items;
        }

        function populateChecklistInfo() {
            document.querySelector("#checklist-name").value = checklistInfo.name;
            document.querySelector("#checklist-description_en").value = checklistInfo.description_en;
            document.querySelector("#checklist-description_cn").value = checklistInfo.description_cn;
            document.querySelector("#checklist-translation_overwrite_cn").value = checklistInfo.translation_overwrite_cn;
        }

        function populateChecklistItems() {
            const tBody = document.querySelector('tbody');
            tBody.innerHTML = '';

            checklistItems.forEach((item, index) => {
                const row = document.createElement('tr');
                row.setAttribute('id', `item-id-${item.id}`); // Set the id for the row
                row.innerHTML = `
                    <td class="align-middle text-center">${index + 1}</td>

                    <td id="item-title-${item.id}">
                        <div class="mb-3">
                            <div class="small">English: </div>
                            <textarea rows="3" class="form-control">${item.title_en}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="small">Chinese: </div>
                            <textarea rows="3" class="form-control">${item.title_cn}</textarea>
                        </div>

                        <button class="btn btn-primary btn-sm">AI Translate</button>
                    </td>

                    <td id="item-description-${item.id}">
                        <div class="mb-3">
                            <div class="small">English: </div>
                            <textarea rows="3" class="form-control">${item.description_en}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="small">Chinese: </div>
                            <textarea rows="3" class="form-control">${item.description_cn}</textarea>
                        </div>

                        <button class="btn btn-primary btn-sm">AI Translate</button>
                    </td>

                    <td id="item-notes-${item.id}">
                        <div class="mb-3">
                            <div class="small">English: </div>
                            <textarea rows="3" class="form-control">${item.notes_en}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="small">Chinese: </div>
                            <textarea rows="3" class="form-control">${item.notes_cn}</textarea>
                        </div>

                        <button class="btn btn-primary btn-sm">AI Translate</button>
                    </td>

                    <td id="item-video_link-${item.id}">
                         <div class="mb-3">
                            <div class="small">English: </div>
                            <textarea rows="3" class="form-control">${item.video_link}</textarea>
                        </div>
                    </td>

                    <td id="item-video_desc-${item.id}">
                        <div class="mb-3">
                            <div class="small">English: </div>
                            <textarea rows="3" class="form-control">${item.video_desc_en}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="small">Chinese: </div>
                            <textarea rows="3" class="form-control">${item.video_desc_cn}</textarea>
                        </div>

                        <button class="btn btn-primary btn-sm">AI Translate</button>
                    </td>

                    <td>
                        <button class="btn btn-primary" onclick="deleteItem(${item.id})">Delete</button>
                    </td>
                `;
                tBody.appendChild(row);
            });
            const lastRow = document.createElement('tr');
            lastRow.setAttribute('id', `item-new`);
            lastRow.innerHTML = `<td class="align-middle text-center bg-secondary" colspan="6"><button class="btn btn-primary" onclick="newItem()">&#43;</button></td>`;
            tBody.appendChild(lastRow);
        }

        function newItem() {
            fetch(`/api/item-templates/new`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({checklist_template_id: checklistInfo.id})
            })
            .then(() => {
                console.log("Action Success - Created Item")
                refreshEverything();
            });
        }


        function updateChecklist() {
            let updatedData = {};
            let fields = ["name", "description_en", "translation_overwrite_cn"]
            fields.forEach((field) => {
                let val = document.querySelector(`#checklist-${field}`)?.value || "";
                updatedData[field] = val;
            })

            fetch(`/api/checklist-templates/${checklistInfo.id}/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(updatedData)
            })
            .then(() => {
                console.log("Action Success - Update Checklist")
            });
        }

        function updateItem(id) {
            let updatedData = {};
            let fields = ["description_en", "translation_overwrite_cn", "notes", "video_link"]
            fields.forEach((field) => {
                let val = document.querySelector(`#item-${field}-${id} input`)?.value || "";
                updatedData[field] = val;
            })
            fetch(`/api/item-templates/${id}/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(updatedData)
            })
            .then(() => {
                console.log("Action Success - Update Item")
            });
        }

        function deleteChecklist() {
            
        }

        function deleteItem(id) {
            const del = confirm("Are you sure you want to delete this?");
            if(!del) return;
            fetch(`/api/item-templates/${id}/delete`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
            })
            .then(() => {
                console.log("Action Success - Delete Item");
                refreshEverything();
            });
        }

        

        let updateItemDebounce;
        let updateChecklistDebounce;
        function attachListeners() {
            const itemInputs = document.querySelectorAll(`td[id^="item"]  input`);
            itemInputs.forEach((input) => input.addEventListener("input", function() {
                const id = this.parentElement.getAttribute("id").split("-")[2];
                clearTimeout(updateItemDebounce);
                updateItemDebounce = setTimeout(() => {
                    updateItem(id);
                }, 200)
            }));

            const checklistInputs = document.querySelectorAll(`input[id^="checklist"]`);
            checklistInputs.forEach((input) => input.addEventListener("input", function() {
                clearTimeout(updateChecklistDebounce);
                updateChecklistDebounce = setTimeout(() => {
                    updateChecklist();
                }, 200)
            }));
        }

        </script>
</body>

</html>
