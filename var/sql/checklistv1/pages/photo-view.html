<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Proof</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-dark d-grid" style="height: 100vh; place-content: center;">
    <div class="container-md">
        <img alt="Proof image" class="img-fluid">
    </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const photo_name = new URLSearchParams(window.location.search).get("name");
        if(!photo_name) window.location.href = "/checklists/manage"
        document.querySelector("img").setAttribute(`src`, `/uploads/proofs/${photo_name}`)
    })
</script>
</html>
