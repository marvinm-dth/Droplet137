<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Chinese PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
            .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
            });
        });
        }
    </script>
</head>
<body>
    <button id="generate-pdf">Generate PDF in Chinese</button>

    <script>
        async function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 1024; // Process in chunks of 1024 bytes to avoid stack overflow
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;

            const doc = new jsPDF();

            // Fetch the font file
            const fontUrl = 'https://inventory.orcagroup.io:5023/font/NotoSansSC-Regular.ttf'; // Replace with your server URL
            const fontResponse = await fetch(fontUrl);

            if (!fontResponse.ok) {
                throw new Error(`Failed to fetch font: ${fontResponse.statusText}`);
            }

            const fontArrayBuffer = await fontResponse.arrayBuffer();
            const base64Font = await arrayBufferToBase64(fontArrayBuffer);

            // Add the font to jsPDF
            doc.addFileToVFS('NotoSansSC.ttf', base64Font);
            doc.addFont('NotoSansSC.ttf', 'NotoSansSC', 'normal');
            doc.setFont('NotoSansSC');

            // Add Chinese text
            doc.setFontSize(16);
            doc.text('订单日期: 11/05/2024', 10, 20);
            doc.text('订单名称: John Emerson Nuqui', 10, 40);

            // Save the PDF
            doc.save('订单.pdf');
        }

        document.getElementById('generate-pdf').addEventListener('click', generatePDF);
    </script>
</body>
</html>
