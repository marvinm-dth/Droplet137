<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Inventory</title>
    
    <!-- ============================
            BEGIN: Base + Responsive Styles
    ============================ -->
    <style>
        /* ===== Base Page Styles ===== */
        body {
        font-family: 'Poppins', sans-serif;
        text-align: center;
        background-color: #f8f9fa;
        color: #333;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
    
        /* Container: centered, max‐width 800px */
        .container_info {
        width: 90%;
        max-width: 800px;
        margin: 20px auto;
        background-color: #fff;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
        }
    
        /* Header row (home icon, title, logout) */
        .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        padding-bottom: 20px;
        }
        .header img {
        width: 30px;
        height: 30px;
        margin-right: 10px;
        }
        .header h1 {
        font-size: 2.5em;
        font-weight: 700;
        color: #333;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        white-space: nowrap;
        }
        .logout-button {
        padding: 10px 20px;
        background-color: #cc716c;
        color: #fff;
        font-size: 1em;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s ease;
        text-decoration: none;
        }
        .logout-button:hover {
        background-color: #b3534e;
        }
    
        /* Language selector row */
        .language-select-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-bottom: 20px;
        padding-left: 10px;
        }
        .language-select-wrapper label {
        font-weight: 500;
        margin-right: 10px;
        font-size: 0.95em;
        }
        .language-select-wrapper select {
        padding: 6px 10px;
        font-size: 0.9em;
        border-radius: 4px;
        border: 1px solid #ccc;
        }
    
        /* Supplier buttons container */
        .buttons-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px; /* increased space between buttons */
        margin: 30px 0;
        }
        .buttons-container a {
        text-decoration: none;
        }
        .button.supplier-orders-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 25px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        color: #fff;
        background-color: #218838;
        transition: background-color 0.3s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        font-size: 1em;
        white-space: nowrap;
        }
        .button.supplier-orders-btn:hover {
        background-color: #1a6f2a;
        }
    
        /* Injected classes for language toggling */
        .data-english { display: block; }
        .data-mandarin { display: none; }
    
        /* =========================================================================
            Responsive: Tablets (≤768px)
        ========================================================================== */
        @media (max-width: 768px) {
        .container_info {
            width: 95%;
            padding: 15px;
        }
        .header h1 {
            font-size: 2em;
        }
        .logout-button {
            padding: 8px 16px;
            font-size: 0.9em;
        }
        .language-select-wrapper label {
            font-size: 0.9em;
        }
        .language-select-wrapper select {
            font-size: 0.9em;
        }
        .button.supplier-orders-btn {
            font-size: 0.95em;
            padding: 10px 20px;
        }
        }
    
        /* =========================================================================
            Responsive: Phones (≤480px)
        ========================================================================== */
        @media (max-width: 480px) {
        /* Full‐width container, no extra margin */
        .container_info {
            width: 100%;
            margin: 0;
            padding: 10px;
            box-shadow: none;
        }
    
        /* Header tweaks */
        .header img {
            width: 25px;
            height: 25px;
        }
        .header h1 {
            font-size: 1.5em;
            left: 50%;
        }
        .logout-button {
            padding: 8px 16px;
            font-size: 0.9em;
        }
    
        /* Center the language selector */
        .language-select-wrapper {
            justify-content: center;
        }
        .language-select-wrapper label {
            font-size: 0.85em;
        }
        .language-select-wrapper select {
            font-size: 0.85em;
            padding: 5px 8px;
        }
    
        /* Stack supplier buttons vertically, full width */
        .buttons-container {
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
            margin: 20px 0;
        }
        .button.supplier-orders-btn {
            width: 100%;
            padding: 10px 0;
            font-size: 0.9em;
        }
        .button.supplier-orders-btn .data-english,
        .button.supplier-orders-btn .data-mandarin {
            white-space: normal; /* allow wrapping */
        }
        }
    </style>
    <!-- ============================
            END: Base + Responsive Styles
    ============================ -->
    
    <!-- Manifest and theme color (PWA) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    
    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
            .then(registration => {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
        }
    </script>
    </head>           
<body>
<div class="container_info" id="info-container" style="width: 100%; max-width: 800px; margin: 0 auto;">
    <div class="header">
        <a href="{{ url_for('main') }}" style="text-decoration: none; color: inherit;">
            <img src="/static/home-logo.png" alt="Home" style="width: 30px; height: 30px; vertical-align: middle; margin-right: 10px;">
        </a>
        <h1>Select Supplier</h1>
        <a href="{{ url_for('logout') }}" class="logout-button data-english">Logout</a>
        <a href="{{ url_for('logout') }}" class="logout-button data-mandarin" style="display: none;">登出</a>
    </div>

    <div style="display: flex; align-items: left; justify-content: left; margin-bottom: 20px;">
        <label for="languageSelect" class="description data-english">Choose Language:</label>
        <label for="languageSelect" class="description data-mandarin" style="display: none;">选择语言: </label>
        <select id="languageSelect" onchange="updateDescriptions()" style="margin-left: 10px;">
            <option value="english">English</option>
            <option value="chinese">Chinese</option>
        </select>
    </div>
    
    <div class="buttons-container">
        {% for supplier in supplier_data %}
        <a href="{{ url_for('add_material', supplier_id=supplier.id) }}">
          <button class="button supplier-orders-btn">
            <span class="data-english">{{ supplier.supplier_name }}</span>
            <span class="data-mandarin" style="display: none;">{{ supplier.supplier_name_mandarin }}</span>
          </button>
        </a>
        {% endfor %}
    </div>

    
</div>
<script>
    function updateDescriptions() {
        const language = document.getElementById('languageSelect').value;

        // Save the selected language in local storage
        localStorage.setItem('selectedLanguage', language);

        // Add debugging to ensure the function runs
        console.log(`Language selected: ${language}`);
        
        // Get all elements with class 'data-english' and 'data-mandarin'
        const englishElements = document.querySelectorAll('.data-english');
        const mandarinElements = document.querySelectorAll('.data-mandarin');

        if (language === 'english') {
            englishElements.forEach(element => {
                console.log(`Displaying English element:`, element); 
                element.style.display = 'block';
            });
            mandarinElements.forEach(element => {
                element.style.display = 'none';
            });
        } else if (language === 'chinese') {
            englishElements.forEach(element => {
                element.style.display = 'none';
            });
            mandarinElements.forEach(element => {
                element.style.display = 'block';
            });
        }
    }   

    // Function to load the saved language preference on page load
    document.addEventListener('DOMContentLoaded', () => {
        // Get the selected language from local storage
        const savedLanguage = localStorage.getItem('selectedLanguage');

        // If there's a saved language, set it in the dropdown and update descriptions
        if (savedLanguage) {
            document.getElementById('languageSelect').value = savedLanguage;
            updateDescriptions();
        }
    });
</script>
</body>
</html>
